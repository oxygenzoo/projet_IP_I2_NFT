<figure class="qr-code">
  <svg
    role="img"
    [attr.aria-label]="label()"
    [attr.viewBox]="viewBox()"
    shape-rendering="crispEdges"
  >
    <rect class="qr-code__background" width="100%" height="100%"></rect>
    @for (cell of cells(); track cell.x + '-' + cell.y) {
      <rect class="qr-code__module" [attr.x]="cell.x" [attr.y]="cell.y" width="1" height="1"></rect>
    }
  </svg>
  <figcaption>Scannez pour ajouter des photos</figcaption>
</figure>

<main class="landing-page">
  <app-logo class="page-logo page-logo--landing" [compact]="true"></app-logo>

  <section class="landing-hero">
    <div class="landing-hero__content">
      <p class="eyebrow">Organisations</p>
      <h1>NFT pour groupes, colonies, EHPAD et associations.</h1>
      <p>
        Créez un souvenir clair à partir des photos d’un séjour, avec consentement, partage privé et export.
      </p>
      <div class="hero-actions">
        <a class="btn btn--primary" routerLink="/pricing">Voir les tarifs</a>
        <a class="btn btn--glass" href="mailto:contact@neverforgetyourtrip.com">Contact</a>
      </div>
    </div>
  </section>

  <section class="episode-layout">
    @for (audience of audiences; track audience[0]) {
      <article class="glass-panel episode-summary">
        <p class="eyebrow">{{ audience[0] }}</p>
        <h2>{{ audience[1] }}</h2>
      </article>
    }
  </section>
</main>

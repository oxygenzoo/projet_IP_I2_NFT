spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:travel-app}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

server.port=${PORT:8080}
server.servlet.context-path=/
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

spring.jackson.time-zone=Europe/Paris
spring.jackson.default-property-inclusion=non_null

spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:nft_app;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DATABASE_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DATABASE_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.pool-name=${DATABASE_POOL_NAME:AppHikariPool}
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.use_sql_comments=${JPA_USE_SQL_COMMENTS:false}
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:20}
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.order_inserts=true

supabase.url=${SUPABASE_URL:https://cyjkygaevdcippenlfed.supabase.co}
supabase.key=${SUPABASE_ANON_KEY:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:${JWT_SECRET:}}
supabase.jwks-url=${SUPABASE_JWKS_URL:}

app.upload.dir=${UPLOAD_DIR:uploads/}
app.upload.max-file-size-bytes=${UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

app.ai.service-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS:8000}
app.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS:90000}
app.public-url=${APP_PUBLIC_URL:${FRONTEND_PUBLIC_URL:http://localhost:4300}}

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,http://localhost:*,http://127.0.0.1:*}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}

spring.mail.host=${SMTP_HOST:smtp.sendgrid.net}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:apikey}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}

logging.level.com.nft.backend=${APP_LOG_LEVEL:DEBUG}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.transaction=${SPRING_TRANSACTION_LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG_LEVEL:INFO}
logging.level.org.hibernate.stat=${HIBERNATE_STAT_LOG_LEVEL:INFO}
logging.level.org.hibernate.engine.internal=WARN
logging.level.org.hibernate.internal=WARN

server.error.include-stacktrace=${SERVER_ERROR_STACKTRACE:never}
server.error.include-message=${SERVER_ERROR_MESSAGE:never}

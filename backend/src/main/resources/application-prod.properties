spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:nft_prod;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.pool-name=${DATABASE_POOL_NAME:RenderHikariPool}
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.initialization-fail-timeout=${DATABASE_INITIALIZATION_FAIL_TIMEOUT_MS:-1}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${HIBERNATE_ALLOW_JDBC_METADATA_ACCESS:false}
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
